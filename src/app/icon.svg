<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <rect x="8" y="20" width="48" height="24" rx="5"
        fill="rgba(99, 102, 241, 0.06)"
        stroke="url(#stroke)"
        stroke-width="2.5"
        filter="url(#glow)"/>

  <circle cx="18" cy="32" r="3.2" fill="url(#dot)" filter="url(#glow)"/>
  <circle cx="28" cy="32" r="3.2" fill="url(#dot)" filter="url(#glow)"/>
  <circle cx="38" cy="32" r="3.2" fill="url(#dot)" filter="url(#glow)"/>

  <rect x="46.5" y="26" width="2" height="12" rx="1" fill="url(#dot)" filter="url(#glow)"/>
</svg>
